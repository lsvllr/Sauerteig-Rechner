# Baut das Image (amd64 und arm64) in die GitHub Container Registry und veröffentlicht das Home-Assistant-Add-on:
#   ghcr.io/lsvllr/sauerteig-rechner:latest
#   ghcr.io/lsvllr/sauerteig-rechner:sha-<7>   (= Version des Add-ons, HA lädt genau dieses Tag)
# Danach wird ha-addon/ nach github.com/lsvllr/sauerteig-addon kopiert, mit version: sha-<7> in config.yaml.
# HA zeigt dann „Update verfügbar“ (mit Auto-Update spielt es das selbst ein).
#
# Einrichten: GitHub > Settings > Secrets and variables > Actions
#   Secret   ADDON_TOKEN   Fine-grained Token, nur Repo sauerteig-addon, Contents: Read and write
# Das Paket sauerteig-rechner nach dem ersten Lauf auf Public prüfen/stellen (Package settings > Danger Zone).
name: Image bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: image-build

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: HA_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/lsvllr/sauerteig-rechner:latest
            ghcr.io/lsvllr/sauerteig-rechner:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  addon:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Add-on-Repo aktualisieren
        env:
          TOKEN: ${{ secrets.ADDON_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # git clone statt actions/checkout: funktioniert auch mit dem anfangs leeren Repo
          git clone "https://x-access-token:${TOKEN}@github.com/lsvllr/sauerteig-addon.git" addon
          rsync -a --delete --exclude .git app/ha-addon/ addon/
          sed -i "s/^version: .*/version: \"${VERSION}\"/" addon/sauerteig/config.yaml
          cd addon
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Sauerteig ${VERSION}"
          git push origin HEAD:main
